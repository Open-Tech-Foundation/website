<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/img/Logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/Logo.svg" />

    <script>
      // Resolve the stored theme ("light" | "dark" | "system"/unset) before first paint
      // so the pre-rendered HTML never flashes the wrong palette.
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var t =
            s === "light" || s === "dark"
              ? s
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="/app/global.css" />
  </head>
  <body>
    <!-- The OTF Web toolchain mounts the app here and injects the bundle. -->
    <div id="app"></div>
  </body>
</html>
