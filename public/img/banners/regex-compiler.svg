<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="regex-compiler">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#131c2f"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff851b"/><stop offset="1" stop-color="#ffb26b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c8db0" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".1" r=".8">
      <stop offset="0" stop-color="#ff851b" stop-opacity=".22"/><stop offset="1" stop-color="#ff851b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#grid)"/>
  <rect width="800" height="300" fill="url(#glow)"/>
  <rect x="86" y="88" width="270" height="124" rx="14" fill="#131c2f" stroke="#7c8db0" stroke-opacity=".5" stroke-width="2"/>
  <g fill="#7c8db0" fill-opacity=".85" font-family="ui-monospace,Menlo,monospace" font-size="15">
    <text x="110" y="126">digits(4)</text>
    <text x="110" y="154">then("-")</text>
    <text x="110" y="182">digits(2)</text>
  </g>
  <g stroke="url(#acc)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M372 150 H428 M418 139 l12 11 -12 11"/>
  </g>
  <rect x="444" y="112" width="270" height="76" rx="14" fill="#2a1a0c" stroke="#ff851b" stroke-width="2"/>
  <text x="579" y="157" text-anchor="middle" fill="#ffb26b" font-family="ui-monospace,Menlo,monospace" font-size="17">^\d{4}-\d{2}$</text>
  <g fill="#ff851b"><circle cx="120" cy="232" r="5"/><circle cx="150" cy="232" r="5" fill-opacity=".5"/><circle cx="180" cy="232" r="5" fill-opacity=".3"/></g>
</svg>
