<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="OTF Web">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#131c2f"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff851b"/><stop offset="1" stop-color="#ffb26b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c8db0" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".1" r=".8">
      <stop offset="0" stop-color="#ff851b" stop-opacity=".22"/><stop offset="1" stop-color="#ff851b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#grid)"/>
  <rect width="800" height="300" fill="url(#glow)"/>

  <!-- Two app pages behind, routed from the active one in front: file-based routing,
       nested layouts, and client-side navigation between pages. -->
  <g opacity=".45">
    <rect x="96" y="56" width="250" height="150" rx="12" fill="#131c2f" stroke="#7c8db0" stroke-opacity=".45" stroke-width="2"/>
    <rect x="110" y="70" width="222" height="16" rx="5" fill="#7c8db0" fill-opacity=".28"/>
    <rect x="110" y="98" width="120" height="10" rx="4" fill="#7c8db0" fill-opacity=".22"/>
    <rect x="110" y="118" width="180" height="10" rx="4" fill="#7c8db0" fill-opacity=".22"/>
  </g>
  <g opacity=".7">
    <rect x="128" y="80" width="250" height="150" rx="12" fill="#131c2f" stroke="#7c8db0" stroke-opacity=".5" stroke-width="2"/>
    <rect x="142" y="94" width="222" height="16" rx="5" fill="#7c8db0" fill-opacity=".3"/>
    <rect x="142" y="122" width="150" height="10" rx="4" fill="#7c8db0" fill-opacity=".24"/>
    <rect x="142" y="142" width="196" height="10" rx="4" fill="#7c8db0" fill-opacity=".24"/>
  </g>

  <!-- The active page: browser chrome, a route in the address bar, and a layout whose
       one bound node is lit — the zero-VDOM update touching a single element. -->
  <rect x="164" y="106" width="286" height="164" rx="14" fill="#0f1729" stroke="#ff851b" stroke-width="2"/>
  <g>
    <circle cx="184" cy="128" r="4.5" fill="#7c8db0" fill-opacity=".55"/>
    <circle cx="199" cy="128" r="4.5" fill="#7c8db0" fill-opacity=".55"/>
    <circle cx="214" cy="128" r="4.5" fill="#7c8db0" fill-opacity=".55"/>
    <rect x="232" y="120" width="200" height="16" rx="8" fill="#7c8db0" fill-opacity=".16"/>
    <text x="244" y="132" fill="#ffb26b" font-family="ui-monospace,Menlo,monospace" font-size="11">/app/page.jsx</text>
  </g>
  <path d="M164 148 H450" stroke="#7c8db0" stroke-opacity=".3" stroke-width="1.5"/>
  <rect x="182" y="164" width="90" height="88" rx="8" fill="#7c8db0" fill-opacity=".12"/>
  <rect x="286" y="164" width="146" height="14" rx="5" fill="#7c8db0" fill-opacity=".3"/>
  <rect x="286" y="188" width="112" height="10" rx="4" fill="#7c8db0" fill-opacity=".22"/>
  <rect x="286" y="222" width="120" height="30" rx="8" fill="#2a1a0c" stroke="#ff851b" stroke-width="2"/>
  <text x="346" y="242" text-anchor="middle" fill="#ffb26b" font-family="ui-monospace,Menlo,monospace" font-size="12">$state</text>

  <!-- JSX compiles straight to the DOM node bound to that state — no virtual tree. -->
  <g stroke="url(#acc)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 190 H548 M538 179 l12 11 -12 11"/>
  </g>
  <g fill="none" stroke="#7c8db0" stroke-opacity=".45" stroke-width="2">
    <path d="M636 96 V132 M636 132 H580 M636 132 H692 M580 132 V158 M692 132 V158"/>
  </g>
  <rect x="606" y="66" width="60" height="30" rx="8" fill="#131c2f" stroke="#7c8db0" stroke-opacity=".55" stroke-width="2"/>
  <rect x="550" y="158" width="60" height="30" rx="8" fill="#131c2f" stroke="#7c8db0" stroke-opacity=".55" stroke-width="2"/>
  <rect x="662" y="158" width="60" height="30" rx="8" fill="#2a1a0c" stroke="#ff851b" stroke-width="2"/>
  <path d="M636 132 H692 V158" stroke="url(#acc)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="636" y="222" text-anchor="middle" fill="#7c8db0" fill-opacity=".8" font-family="ui-monospace,Menlo,monospace" font-size="12">native DOM</text>
</svg>
