<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="ES Runtime">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#131c2f"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff851b"/><stop offset="1" stop-color="#ffb26b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c8db0" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".1" r=".8">
      <stop offset="0" stop-color="#ff851b" stop-opacity=".22"/><stop offset="1" stop-color="#ff851b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#grid)"/>
  <rect width="800" height="300" fill="url(#glow)"/>

  <!-- Inbound request -->
  <rect x="46" y="130" width="142" height="34" rx="10" fill="#131c2f" stroke="#7c8db0" stroke-opacity=".5" stroke-width="2"/>
  <text x="64" y="153" fill="#7c8db0" fill-opacity=".9" font-family="ui-monospace,Menlo,monospace" font-size="14">GET /api</text>
  <g stroke="url(#acc)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 147 H264 M254 136 l12 11 -12 11"/>
  </g>

  <!-- The server: three stacked rack units with status LEDs and drive bays -->
  <g>
    <rect x="296" y="52" width="208" height="58" rx="10" fill="#0f1729" stroke="#7c8db0" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="322" cy="81" r="6" fill="#7c8db0" fill-opacity=".5"/>
    <g fill="#7c8db0" fill-opacity=".28">
      <rect x="344" y="68" width="86" height="10" rx="4"/><rect x="344" y="86" width="60" height="10" rx="4"/>
    </g>
    <g fill="#7c8db0" fill-opacity=".35">
      <rect x="452" y="70" width="8" height="24" rx="3"/><rect x="466" y="70" width="8" height="24" rx="3"/><rect x="480" y="70" width="8" height="24" rx="3"/>
    </g>

    <rect x="296" y="122" width="208" height="58" rx="10" fill="#1a1206" stroke="#ff851b" stroke-width="2"/>
    <circle cx="322" cy="151" r="6" fill="#ff851b"/>
    <g fill="#ffb26b" fill-opacity=".38">
      <rect x="344" y="138" width="86" height="10" rx="4"/><rect x="344" y="156" width="60" height="10" rx="4"/>
    </g>
    <g fill="#ff851b" fill-opacity=".45">
      <rect x="452" y="140" width="8" height="24" rx="3"/><rect x="466" y="140" width="8" height="24" rx="3"/><rect x="480" y="140" width="8" height="24" rx="3"/>
    </g>

    <rect x="296" y="192" width="208" height="58" rx="10" fill="#0f1729" stroke="#7c8db0" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="322" cy="221" r="6" fill="#7c8db0" fill-opacity=".5"/>
    <g fill="#7c8db0" fill-opacity=".28">
      <rect x="344" y="208" width="86" height="10" rx="4"/><rect x="344" y="226" width="60" height="10" rx="4"/>
    </g>
    <g fill="#7c8db0" fill-opacity=".35">
      <rect x="452" y="210" width="8" height="24" rx="3"/><rect x="466" y="210" width="8" height="24" rx="3"/><rect x="480" y="210" width="8" height="24" rx="3"/>
    </g>
  </g>

  <!-- JavaScript is what runs on it — the official mark, badged on the active unit -->
  <g transform="translate(516 118) scale(2.6667)">
    <path fill="#f7df1e" d="M0 0h24v24H0V0zm22.034 18.276c-.175-1.095-.888-2.015-3.003-2.873-.736-.345-1.554-.585-1.797-1.14-.091-.33-.105-.51-.046-.705.15-.646.915-.84 1.515-.66.39.12.75.42.976.9 1.034-.676 1.034-.676 1.755-1.125-.27-.42-.404-.601-.586-.78-.63-.705-1.469-1.065-2.834-1.034l-.705.089c-.676.165-1.32.525-1.71 1.005-1.14 1.291-.811 3.541.569 4.471 1.365 1.02 3.361 1.244 3.616 2.205.24 1.17-.87 1.545-1.966 1.41-.811-.18-1.26-.586-1.755-1.336l-1.83 1.051c.21.48.45.689.81 1.109 1.74 1.756 6.09 1.666 6.871-1.004.029-.09.24-.705.074-1.65l.046.067zm-8.983-7.245h-2.248c0 1.938-.009 3.864-.009 5.805 0 1.232.063 2.363-.138 2.711-.33.689-1.18.601-1.566.48-.396-.196-.597-.466-.83-.855-.063-.105-.11-.196-.127-.196l-1.825 1.125c.305.63.75 1.172 1.324 1.517.855.51 2.004.675 3.207.405.783-.226 1.458-.691 1.811-1.411.51-.93.402-2.07.397-3.346.012-2.054 0-4.109 0-6.179l.004-.056z"/>
  </g>

  <!-- Outbound response -->
  <g stroke="url(#acc)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M596 88 H648 M638 77 l12 11 -12 11"/>
  </g>
  <rect x="662" y="66" width="106" height="44" rx="10" fill="#2a1a0c" stroke="#ff851b" stroke-width="2"/>
  <text x="680" y="94" fill="#ffb26b" font-family="ui-monospace,Menlo,monospace" font-size="14">200 OK</text>

  <!-- Host capabilities are injected by the embedder, not baked in -->
  <g fill="#131c2f" stroke="#7c8db0" stroke-opacity=".45" stroke-width="2">
    <rect x="618" y="198" width="70" height="32" rx="8"/>
    <rect x="698" y="198" width="70" height="32" rx="8"/>
  </g>
  <g fill="#7c8db0" fill-opacity=".85" font-family="ui-monospace,Menlo,monospace" font-size="13" text-anchor="middle">
    <text x="653" y="219">fs</text><text x="733" y="219">net</text>
  </g>
  <path d="M653 198 V214 H540 V190" fill="none" stroke="#7c8db0" stroke-opacity=".3" stroke-width="2"/>
  <path d="M733 198 V236 H540 V228" fill="none" stroke="#7c8db0" stroke-opacity=".3" stroke-width="2"/>
</svg>
