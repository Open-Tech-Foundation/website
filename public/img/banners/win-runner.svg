<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Win-Runner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#131c2f"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff851b"/><stop offset="1" stop-color="#ffb26b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c8db0" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".1" r=".8">
      <stop offset="0" stop-color="#ff851b" stop-opacity=".22"/><stop offset="1" stop-color="#ff851b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#grid)"/>
  <rect width="800" height="300" fill="url(#glow)"/>

  <!-- The Windows program: a window with title-bar controls on the right, four panes -->
  <rect x="64" y="104" width="160" height="92" rx="10" fill="#131c2f" stroke="#7c8db0" stroke-opacity=".5" stroke-width="2"/>
  <path d="M64 128 H224" stroke="#7c8db0" stroke-opacity=".5" stroke-width="2"/>
  <g stroke="#7c8db0" stroke-opacity=".7" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M184 119 h8"/>
    <rect x="200" y="115" width="7" height="7"/>
    <path d="M215 114 l7 7 M222 114 l-7 7"/>
  </g>
  <g fill="#7c8db0" fill-opacity=".5">
    <rect x="130" y="138" width="12" height="12"/><rect x="145" y="138" width="12" height="12"/>
    <rect x="130" y="153" width="12" height="12"/><rect x="145" y="153" width="12" height="12"/>
  </g>
  <text x="144" y="186" text-anchor="middle" fill="#7c8db0" fill-opacity=".9" font-family="ui-monospace,Menlo,monospace" font-size="15">app.exe</text>
  <text x="144" y="222" text-anchor="middle" fill="#7c8db0" fill-opacity=".55" font-family="ui-monospace,Menlo,monospace" font-size="13">Windows</text>

  <g stroke="url(#acc)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 150 H292 M282 139 l12 11 -12 11"/>
  </g>

  <!-- The compatibility engine: native speed above, API shims below -->
  <rect x="300" y="96" width="200" height="108" rx="12" fill="#1a1206" stroke="#ff851b" stroke-width="2"/>
  <text x="322" y="124" fill="#ffb26b" font-family="ui-monospace,Menlo,monospace" font-size="18">winrun</text>
  <g fill="#ffb26b" fill-opacity=".38">
    <rect x="322" y="138" width="96" height="10" rx="4"/><rect x="322" y="156" width="70" height="10" rx="4"/>
  </g>
  <path d="M322 182 H478" stroke="#ff851b" stroke-opacity=".45" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#ff851b" fill-opacity=".45">
    <rect x="322" y="188" width="22" height="9" rx="3"/><rect x="350" y="188" width="22" height="9" rx="3"/>
    <rect x="378" y="188" width="22" height="9" rx="3"/><rect x="406" y="188" width="22" height="9" rx="3"/>
    <rect x="434" y="188" width="22" height="9" rx="3"/>
  </g>
  <text x="466" y="196" fill="#ff851b" fill-opacity=".8" font-family="ui-monospace,Menlo,monospace" font-size="10">shims</text>

  <!-- Disposable C: drive — dashed, ephemeral -->
  <rect x="322" y="226" width="156" height="34" rx="8" fill="#131c2f" stroke="#7c8db0" stroke-opacity=".5" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="340" y="248" fill="#7c8db0" fill-opacity=".9" font-family="ui-monospace,Menlo,monospace" font-size="15">C:\</text>
  <text x="388" y="247" fill="#7c8db0" fill-opacity=".55" font-family="ui-monospace,Menlo,monospace" font-size="11">disposable</text>
  <path d="M400 204 V226" stroke="#7c8db0" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 4"/>

  <g stroke="url(#acc)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M508 150 H584 M574 139 l12 11 -12 11"/>
  </g>

  <!-- Runs on the Linux host: a terminal with the command, output, and a clean exit -->
  <rect x="592" y="104" width="160" height="92" rx="10" fill="#0f1729" stroke="#7c8db0" stroke-opacity=".5" stroke-width="2"/>
  <text x="608" y="136" fill="#7c8db0" fill-opacity=".9" font-family="ui-monospace,Menlo,monospace" font-size="12">$ winrun app.exe</text>
  <g fill="#7c8db0" fill-opacity=".28">
    <rect x="608" y="148" width="100" height="9" rx="4"/><rect x="608" y="164" width="76" height="9" rx="4"/>
  </g>
  <text x="608" y="190" fill="#ffb26b" font-family="ui-monospace,Menlo,monospace" font-size="12">exit 0</text>
  <text x="672" y="222" text-anchor="middle" fill="#7c8db0" fill-opacity=".55" font-family="ui-monospace,Menlo,monospace" font-size="13">Linux</text>
</svg>
