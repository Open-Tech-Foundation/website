<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="obj-diff">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#131c2f"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff851b"/><stop offset="1" stop-color="#ffb26b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c8db0" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".1" r=".8">
      <stop offset="0" stop-color="#ff851b" stop-opacity=".22"/><stop offset="1" stop-color="#ff851b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#grid)"/>
  <rect width="800" height="300" fill="url(#glow)"/>

  <!-- Before: the source object -->
  <rect x="64" y="62" width="220" height="176" rx="12" fill="#131c2f" stroke="#7c8db0" stroke-opacity=".5" stroke-width="2"/>
  <g fill="#7c8db0" fill-opacity=".85" font-family="ui-monospace,Menlo,monospace" font-size="14">
    <text x="84" y="96">{</text>
    <text x="84" y="120">  "name": "a",</text>
    <text x="84" y="144">  "color": "red",</text>
    <text x="84" y="168">  "count": 3,</text>
    <text x="84" y="192">  "nested": { "x": 1 }</text>
    <text x="84" y="216">}</text>
  </g>
  <text x="174" y="262" text-anchor="middle" fill="#7c8db0" fill-opacity=".55" font-family="ui-monospace,Menlo,monospace" font-size="13">before</text>

  <g stroke="url(#acc)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M292 118 H332 M322 107 l12 11 -12 11"/>
  </g>

  <!-- The computed patch: just the changes, nothing else -->
  <rect x="340" y="64" width="120" height="112" rx="10" fill="#2a1a0c" stroke="#ff851b" stroke-width="2"/>
  <text x="354" y="88" fill="#ff851b" fill-opacity=".8" font-family="ui-monospace,Menlo,monospace" font-size="11">patch</text>
  <g fill="#ffb26b" font-family="ui-monospace,Menlo,monospace" font-size="11">
    <text x="354" y="108">~ "color"</text>
    <text x="362" y="126">red → blue</text>
    <text x="354" y="148">~ "count"</text>
    <text x="362" y="166">3 → 4</text>
  </g>

  <g stroke="url(#acc)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M468 118 H508 M498 107 l12 11 -12 11"/>
  </g>

  <!-- After: changed rows highlighted -->
  <rect x="516" y="62" width="220" height="176" rx="12" fill="#131c2f" stroke="#7c8db0" stroke-opacity=".5" stroke-width="2"/>
  <g fill="#ff851b" fill-opacity=".1">
    <rect x="524" y="128" width="204" height="20" rx="4"/>
    <rect x="524" y="152" width="204" height="20" rx="4"/>
  </g>
  <g fill="#7c8db0" fill-opacity=".85" font-family="ui-monospace,Menlo,monospace" font-size="14">
    <text x="536" y="96">{</text>
    <text x="536" y="120">  "name": "a",</text>
  </g>
  <g fill="#ffb26b" font-family="ui-monospace,Menlo,monospace" font-size="14">
    <text x="536" y="144">  "color": "blue",</text>
    <text x="536" y="168">  "count": 4,</text>
  </g>
  <g fill="#7c8db0" fill-opacity=".85" font-family="ui-monospace,Menlo,monospace" font-size="14">
    <text x="536" y="192">  "nested": { "x": 1 }</text>
    <text x="536" y="216">}</text>
  </g>
  <text x="626" y="262" text-anchor="middle" fill="#7c8db0" fill-opacity=".55" font-family="ui-monospace,Menlo,monospace" font-size="13">after</text>
</svg>
